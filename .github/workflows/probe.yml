name: Probe

# 在 iOS 27 iPad 模擬器上只跑幾個實驗用的測試（比整套 CI 快）：目前是 JT 甘特、右側欄待辦與 iPhone 浮動搜尋的截圖（假資料，以 base64 印在記錄裡）。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"
      - "LocalOCR/Features/JT/**"
      - "LocalOCR/Features/Workspace/**"
      - "LocalOCRTests/JtScreenshotProbeTests.swift"

jobs:
  probe:
    name: Probe tests (iOS 27 iPad)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Pick an iOS 27 simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          best = None
          for runtime, items in json.load(sys.stdin)['devices'].items():
              m = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not m: continue
              v = (int(m.group(1)), int(m.group(2)))
              for d in items:
                  if d.get('isAvailable') and d['name'].startswith('iPad') and (best is None or v > best[0]):
                      best = (v, d['udid'])
          print(best[1] if best else '')")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Use the on-screen keyboard in the simulator
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      - name: Probe
        env:
          TEST_RUNNER_JT_SHOT: "1"
        run: |
          status=0
          xcodebuild test -project LocalOCR.xcodeproj -scheme LocalOCR \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:LocalOCRTests/JtScreenshotProbeTests \
            CODE_SIGNING_ALLOWED=NO > probe.log 2>&1 || status=$?
          grep -E "error:|\[probe\]|crash|Crash|signal|Fatal|fatal|Test Case|\*\* TEST|Restarting" probe.log | head -80 || true
          grep -E "^\[shot\]" probe.log || true
          echo "exit status $status"
