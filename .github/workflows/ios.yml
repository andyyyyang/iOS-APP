name: iOS CI

on:
  push:
    paths:
      - "LocalOCR/**"
      - "LocalOCRTests/**"
      - "LocalOCR.xcodeproj/**"
      - "server/templates/managed/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 26 (iOS 26 SDK)
            runner: macos-26
          - name: Xcode 27 (iOS 27 SDK)
            runner: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Check bundled templates match the server
        run: diff -r server/templates/managed LocalOCR/Resources/ManagedTemplates

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick iPhone and iPad simulators
        id: simulator
        run: |
          xcrun simctl list devices available --json > devices.json
          pick() {
            python3 - "$1" <<'PY'
          import json, re, sys
          devices = json.load(open("devices.json"))["devices"]
          best = None
          for runtime, items in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in items:
                  if device.get("isAvailable") and device["name"].startswith(sys.argv[1]):
                      if best is None or version > best[0]:
                          best = (version, device["udid"], device["name"])
          print(best[1] if best else "")
          PY
          }
          UDID=$(pick iPhone)
          IPAD=$(pick iPad)
          echo "Using simulator $UDID (iPad: $IPAD)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"

      - name: Use the on-screen keyboard in the simulator
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Unit tests (iOS Simulator)
        run: |
          status=0
          xcodebuild test \
            -project LocalOCR.xcodeproj \
            -scheme LocalOCR \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || status=$?
          grep -E "error:|warning:|\[probe\]|Test Case .* (passed|failed|skipped)|Executed [0-9]+ test|\*\* TEST" test.log || true
          exit $status

      - name: Keyboard layout (iPad simulator)
        if: steps.simulator.outputs.ipad != ''
        run: |
          status=0
          xcodebuild test \
            -project LocalOCR.xcodeproj \
            -scheme LocalOCR \
            -destination "id=${{ steps.simulator.outputs.ipad }}" \
            -only-testing:LocalOCRTests/KeyboardLayoutTests \
            -resultBundlePath KeyboardResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > keyboard.log 2>&1 || status=$?
          grep -E "error:|\[probe\]|Test Case .* (passed|failed|skipped)|Executed [0-9]+ test|\*\* TEST" keyboard.log || true
          exit $status

      - name: Release build (device, unsigned)
        run: |
          status=0
          xcodebuild build \
            -project LocalOCR.xcodeproj \
            -scheme LocalOCR \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || status=$?
          grep -E "error:|warning:|\*\* BUILD" build.log || true
          exit $status

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs-${{ matrix.runner }}
          path: |
            test.log
            build.log
            keyboard.log
            TestResults.xcresult
            KeyboardResults.xcresult
          if-no-files-found: ignore
