name: TestFlight

on:
  workflow_dispatch:
  push:
    # 修改發佈紀錄檔即觸發；推送 v* 標籤也會觸發（標籤不套用路徑篩選）
    paths:
      - ".github/release/testflight.txt"
      - ".github/release/testers.txt"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  changes:
    name: Decide whether to upload
    runs-on: ubuntu-latest
    outputs:
      upload: ${{ steps.check.outputs.upload }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        # 手動執行、推送標籤或發佈紀錄檔有變更時才上傳；只修改測試人員清單時只寄邀請
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ] \
             || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            upload=true
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qx ".github/release/testflight.txt"; then
            upload=true
          else
            upload=false
          fi
          echo "upload=$upload"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

  upload:
    name: Archive & upload to TestFlight
    needs: changes
    if: needs.changes.outputs.upload == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.prepare.outputs.build_number }}
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub secrets:$missing（設定方式見 docs/TESTFLIGHT.md）"
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare API key and export options
        id: prepare
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_ENV"
          echo "build_number=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          status=0
          xcodebuild archive \
            -project LocalOCR.xcodeproj \
            -scheme LocalOCR \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LocalOCR.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > archive.log 2>&1 || status=$?
          grep -E "error:|warning: .*(sign|provision)|\*\* ARCHIVE" archive.log || true
          exit $status

      - name: Upload to App Store Connect
        run: |
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LocalOCR.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || status=$?
          grep -E "error:|Upload|EXPORT" export.log || true
          if [ $status -eq 0 ]; then
            echo "### 已上傳 build $BUILD_NUMBER 到 TestFlight" >> "$GITHUB_STEP_SUMMARY"
            echo "App Store Connect 處理約需 5–30 分鐘，完成後會出現在 TestFlight App 中。" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

  distribute:
    name: Invite internal testers
    needs: [changes, upload]
    if: always() && needs.changes.result == 'success' && (needs.upload.result == 'success' || needs.upload.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
      EXPECTED_BUILD: ${{ needs.upload.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "pyjwt[crypto]" requests
      - name: Add testers and send TestFlight invitations
        run: python .github/scripts/testflight_testers.py
