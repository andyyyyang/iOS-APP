name: Obsidian Plugin Release

# Publishes each plugin version as the GitHub release "obsidian-plugin-<version>" with main.js and
# manifest.json, then asks the LocalOCR server on Railway to mirror it into its storage bucket right away
# (it also mirrors every 30 minutes); the plugin's online updater (obsidian-plugin/src/updater.ts) installs
# from the server, with these GitHub releases as fallback.
# Runs when manifest.json changes (a version bump); a version that already has a release is skipped.

on:
  push:
    paths:
      - "obsidian-plugin/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obsidian-plugin-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed main.js matches the source
        run: git diff --exit-code -- main.js || (echo "::error::main.js 與原始碼不一致，請執行 npm run build 後提交" && exit 1)
      - name: Version
        id: version
        run: |
          node <<'JS'
          const manifest = require("./manifest.json");
          const pkg = require("./package.json");
          const versions = require("./versions.json");
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error(`manifest.json version must be x.y.z, got ${manifest.version}`);
          if (pkg.version !== manifest.version) throw new Error(`package.json ${pkg.version} ≠ manifest.json ${manifest.version}`);
          if (versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error(`versions.json must map ${manifest.version} to ${manifest.minAppVersion}`);
          }
          JS
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=obsidian-plugin-$version" >> "$GITHUB_OUTPUT"
      - name: Publish (skipped when this version is already released)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG 已發佈，略過"
            exit 0
          fi
          # Release notes: the CHANGELOG.md section "## <version>"
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          test -s release-notes.md || echo "LocalOCR Sync $VERSION" > release-notes.md
          gh release create "$TAG" main.js manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LocalOCR Sync $VERSION" \
            --notes-file release-notes.md
          echo "已發佈 $TAG"
      - name: Mirror into the Railway server (needs LOCALOCR_API_KEY secret)
        # Never fails the release: the server mirrors on its own within 30 minutes anyway.
        continue-on-error: true
        timeout-minutes: 6
        env:
          BASE_URL: https://localocr-server-production.up.railway.app
          API_KEY: ${{ secrets.LOCALOCR_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::notice::未設定 LOCALOCR_API_KEY secret，略過；伺服器會在 30 分鐘內自動同步 $VERSION"
            exit 0
          fi
          out="$RUNNER_TEMP/refresh.json"
          # Railway may still be deploying a server change pushed together with this version: retry for a few minutes.
          # The key goes to curl on stdin (-H @-), never on a command line or in the log.
          for attempt in $(seq 1 6); do
            code=$(printf 'Authorization: Bearer %s\n' "$API_KEY" \
              | curl -sS -o "$out" -w "%{http_code}" --max-time 45 -X POST -H @- "$BASE_URL/v1/obsidian-plugin/refresh" || true)
            echo "refresh 第 $attempt 次：HTTP $code $(head -c 500 "$out" 2>/dev/null)"
            if [ "$code" = "200" ] && curl -fsS -o /dev/null "$BASE_URL/obsidian-plugin/releases/$VERSION/manifest.json"; then
              echo "已同步到伺服器：$BASE_URL/obsidian-plugin/latest.json"
              echo "- 伺服器已同步 $VERSION：$BASE_URL/obsidian-plugin/latest.json" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::伺服器尚未同步 $VERSION（可能還在部署），它會在 30 分鐘內自動同步"
